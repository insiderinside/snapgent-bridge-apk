import java.util.Properties

plugins {
    id 'com.android.application'
    // Embedded CPython runtime (prebuilt, no NDK needed). Ships as libpython3.x.so.
    id 'com.chaquo.python' version '16.1.0'
}

// Release signing material lives OUTSIDE the repository.
// Override the location with SNAPGENT_KEYSTORE_PROPERTIES when building elsewhere.
def keystorePropsFile = file(
    System.getenv('SNAPGENT_KEYSTORE_PROPERTIES')
        ?: "${System.getProperty('user.home')}/.android/snapgent-release/keystore.properties"
)
def keystoreProps = new Properties()
def hasReleaseKeystore = keystorePropsFile.isFile()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'dev.snapgent.bridge'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.snapgent.bridge'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.1.9'
        // The embedded Python runtime ships one native lib per ABI. Phones are arm64;
        // x86_64 is only needed for emulators, so keep the APK small.
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('snapgent: release keystore not found at ' + keystorePropsFile +
                    ' — release build falls back to the debug signing config.')
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundled Python packages. Chaquopy runs pip at BUILD time and packs the wheels
// into the APK, so the device never needs a package manager or writable exec
// storage (targetSdk 34 blocks running downloaded binaries anyway).
// Only pure-Python or Chaquopy-published arm64 wheels work here; adding a package
// without an arm64 wheel fails the build, it does not fail at runtime.
chaquopy {
    defaultConfig {
        pip {
            install "requests"
            install "Pillow"
        }
    }
}

dependencies {
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
}
