plugins { id 'com.android.application' }

android {
    namespace 'dev.snapgent.bridge'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.snapgent.bridge'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            // Internal release signing with the standard Android debug keystore.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
}
